[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "testlie"
version = "0.1.0"
description = "Testlie client: disposable email inboxes, wait-for-email, OTP and magic-link extraction for end-to-end tests, with a pytest plugin"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carrier Grade Inc.", email = "support@testlie.com" }]
maintainers = [{ name = "Carrier Grade Inc.", email = "support@testlie.com" }]
dependencies = []
keywords = ["testlie", "email", "email-testing", "smtp", "otp", "magic-link", "disposable-inbox", "pytest", "e2e", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://testlie.com"
Documentation = "https://testlie.com/docs/sdks"
Repository = "https://github.com/carriergrade/testlie-sdk"
Issues = "https://github.com/carriergrade/testlie-sdk/issues"
Changelog = "https://github.com/carriergrade/testlie-sdk/blob/main/packages/sdk-python/CHANGELOG.md"

[project.entry-points.pytest11]
testlie = "testlie.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testlie = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
